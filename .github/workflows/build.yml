name: Build Android APK Fix

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip \*.zip -d extracted_files
          ls -R extracted_files

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Find and Build APK
        run: |
          # Yeh script khud gradlew file ko dhoond kar build chala degi
          PROJECT_DIR=$(find extracted_files -name "gradlew" -exec dirname {} \;)
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sarah_AI_v1
          path: '**/build/outputs/apk/debug/app-debug.apk'
